<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body, #m { margin: 0; height: 100%; background: #EEF0EA; }
  .leaflet-container { font-family: Inter, system-ui, sans-serif; background: #EEF0EA; }
  .soft-tiles { filter: grayscale(.55) saturate(.7) contrast(.95) brightness(1.03); }
  .leaflet-tooltip { background: #fff; color: #101F2C; border: 1px solid #E4E8E5; border-radius: 8px; box-shadow: 0 2px 8px rgba(16,31,44,.12); }
  .tip { font-size: 12px; line-height: 1.4; color: #62717D; } .tip b { color: #101F2C; }
  .leaflet-control-attribution { background: #ffffffcc !important; color: #62717D !important; }
  #note { position: absolute; z-index: 999; left: 10px; bottom: 22px; background: #fffffff2; border: 1px solid #E4E8E5; border-radius: 10px;
          padding: 6px 10px; color: #62717D; font: 11px Inter, system-ui, sans-serif; max-width: 60%; }
  #legend { position: absolute; z-index: 999; right: 10px; bottom: 22px; background: #fffffff2; border: 1px solid #E4E8E5; border-radius: 10px;
            padding: 8px 10px; color: #101F2C; font: 11px Inter, system-ui, sans-serif; }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
<div id="m"></div><div id="note"></div><div id="legend"></div>
<script>
// Minimal Streamlit component protocol (no build step): tell Streamlit we are ready, receive args, send a value back on click.
function send(type, data) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*"); }
var map = L.map('m', { zoomControl: true, minZoom: 3, maxZoom: 10, scrollWheelZoom: false });
map.fitBounds([[6.5, 67.5], [36.0, 98.0]]);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19, className: 'soft-tiles' }).addTo(map);
var layer = L.layerGroup().addTo(map);
window.__markers = {};

function render(args) {
  layer.clearLayers(); window.__markers = {};
  var pts = args.points || [], sel = args.selected, stages = {};
  pts.forEach(function (p) {
    var isSel = String(p.id) === String(sel);
    var r = p.investigated ? 9 : 5;
    if (isSel) { L.circleMarker([p.lat, p.lon], { radius: r + 9, color: '#101F2C', weight: 2, fillOpacity: 0, interactive: false }).addTo(layer); }
    var m = L.circleMarker([p.lat, p.lon], { radius: r, color: '#ffffff', weight: p.investigated ? 2.5 : 1, fillColor: p.color, fillOpacity: p.investigated ? 1 : .8 });
    var sc = p.score === null || p.score === undefined ? '' : '<br>' + p.score_kind + ' ' + p.score;
    m.bindTooltip('<div class="tip"><b>' + p.name + '</b><br>' + p.city + ' &middot; ' + p.stage + sc + '</div>');
    m.on('click', function () { send("streamlit:setComponentValue", { value: { id: String(p.id), t: Date.now() }, dataType: "json" }); });
    m.addTo(layer); window.__markers[String(p.id)] = m;
    stages[p.stage] = p.color;
  });
  var lg = ''; Object.keys(stages).forEach(function (k) { lg += '<div><i style="background:' + stages[k] + '"></i>' + k + '</div>'; });
  document.getElementById('legend').innerHTML = lg;
  document.getElementById('note').innerHTML = args.note || '';
  send("streamlit:setFrameHeight", { height: args.height || 460 });
}

window.addEventListener("message", function (e) {
  if (e.data && e.data.type === "streamlit:render") { render(e.data.args || {}); }
});
send("streamlit:componentReady", { apiVersion: 1 });
send("streamlit:setFrameHeight", { height: 460 });
</script>
</body>
</html>
